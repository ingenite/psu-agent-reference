name: PowerShell CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pester (full suite)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned test dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $dependencies = Import-PowerShellDataFile ./tools/BuildDependencies.psd1
          foreach ($dependency in $dependencies.GetEnumerator()) {
              Install-PSResource -Name $dependency.Key -Version $dependency.Value -Repository PSGallery -Scope CurrentUser -TrustRepository -Quiet
          }

      - name: Run full Pester suite through Invoke-Build
        run: |
          $ErrorActionPreference = 'Stop'
          $dependencies = Import-PowerShellDataFile ./tools/BuildDependencies.psd1
          Import-Module InvokeBuild -RequiredVersion $dependencies.InvokeBuild
          Invoke-Build Test

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results
          path: tools/output/tests/*.xml
          if-no-files-found: warn
